<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title data-i18n="title.reset">Mot de passe oublié – Global Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="i18n.js"></script>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="index.html">Global Store</a>
      <nav>
        <select class="lang-select" id="langSelect" data-i18n-aria="lang.label" aria-label="Langue"></select>
        <a href="connexion.html" data-i18n="nav.login">Connexion</a>
      </nav>
    </div>
  </header>
  <main class="auth">
    <div class="auth-side">
      <h2 data-i18n="reset.side.title">Mot de passe oublié ?</h2>
      <p data-i18n="reset.side.p">Pas de souci : nous vous aidons à retrouver l'accès à votre compte.</p>
    </div>
    <div class="auth-form">
      <form id="form" data-mode="reset" novalidate>
        <h1 data-i18n="reset.title">Réinitialiser le mot de passe</h1>
        <p data-i18n="reset.sub">Entrez votre e-mail : nous vous envoyons un lien pour choisir un nouveau mot de passe.</p>
        <label for="email" data-i18n="reg.email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <button class="btn" type="submit" data-i18n="reset.submit">Envoyer le lien</button>
        <div class="msg" id="msg" role="alert" aria-live="polite"></div>
        <p class="alt"><a href="connexion.html" data-i18n="reset.back">Retour à la connexion</a></p>
      </form>
    </div>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
