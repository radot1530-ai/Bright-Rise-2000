<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1f">
  <title data-i18n="title.register">Créer un compte – Global Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="i18n.js"></script>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="index.html">Global Store</a>
      <nav>
        <select class="lang-select" id="langSelect" data-i18n-aria="lang.label" aria-label="Langue"></select>
        <a href="index.html" data-i18n="nav.about">À propos</a>
      </nav>
    </div>
  </header>
  <main class="auth">
    <div class="auth-side">
      <h2 data-i18n="auth.side.title">Rejoignez Global Store.</h2>
      <p data-i18n="auth.side.p">Un compte pour suivre toutes vos commandes.</p>
    </div>
    <div class="auth-form">
      <form id="form" data-mode="register" novalidate>
        <h1 data-i18n="reg.title">Créer un compte</h1>
        <p data-i18n="reg.sub">Gratuit, prêt en moins d'une minute.</p>
        <label for="name" data-i18n="reg.name">Nom complet</label>
        <input id="name" type="text" autocomplete="name" required>
        <label for="email" data-i18n="reg.email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password" data-i18n="reg.password">Mot de passe</label>
        <div class="pw"><input id="password" type="password" autocomplete="new-password" minlength="6" required><button type="button" id="toggle" data-i18n="auth.show">Afficher</button></div>
        <label for="confirm" data-i18n="reg.confirm">Confirmer le mot de passe</label>
        <input id="confirm" type="password" autocomplete="new-password" required>
        <button class="btn" type="submit" data-i18n="reg.submit">Créer mon compte</button>
        <div class="msg" id="msg" role="alert" aria-live="polite"></div>
        <p class="alt"><span data-i18n="reg.have">Déjà inscrit ?</span> <a href="connexion.html" data-i18n="reg.login">Se connecter</a></p>
      </form>
    </div>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
