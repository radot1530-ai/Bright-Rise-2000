<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créer un compte – Global Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="index.html">Global Store</a>
  <nav><a href="index.html">À propos</a></nav>
</div></header>
<main class="auth">
  <div class="auth-side">
    <h2>Rejoignez Global Store.</h2>
    <p>Un compte pour suivre toutes vos commandes.</p>
  </div>
  <div class="auth-form">
    <form id="form" data-mode="register" novalidate>
      <h1>Créer un compte</h1>
      <p>Gratuit, prêt en moins d'une minute.</p>
      <label for="name">Nom complet</label>
      <input id="name" type="text" autocomplete="name" required>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Mot de passe</label>
      <div class="pw"><input id="password" type="password" autocomplete="new-password" minlength="6" required><button type="button" id="toggle">Afficher</button></div>
      <label for="confirm">Confirmer le mot de passe</label>
      <input id="confirm" type="password" autocomplete="new-password" required>
      <button class="btn" type="submit">Créer mon compte</button>
      <div class="msg" id="msg" role="alert" aria-live="polite"></div>
      <p class="alt">Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
    </form>
  </div>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
