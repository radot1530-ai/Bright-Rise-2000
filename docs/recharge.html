<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title data-i18n="dash.topup">Recharger mon solde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="i18n.js"></script>
</head>
<body>

  <header class="dash-header">
    <div class="wrap">
      <a class="logo" href="dashboard.html">Global Store</a>
      <div class="topbar-extra">
        <select class="currency-select" id="currencySelect" data-i18n-aria="cur.label" aria-label="Devise"></select>
        <select class="lang-select" id="langSelect" data-i18n-aria="lang.label" aria-label="Langue"></select>
        <a class="btn ghost" href="dashboard.html" data-i18n="nav.dashboard">Tableau de bord</a>
      </div>
    </div>
  </header>

  <main class="checkout-wrap">
    <h1 class="dash-hello" data-i18n="dash.topup">Recharger mon solde</h1>

    <div class="stat stat-balance" style="margin-top:20px">
      <div class="n" id="statBalance">—</div>
      <div class="l" data-i18n="dash.balance">Solde disponible</div>
    </div>

    <div class="dash-section">
      <div class="pay-grid" id="payGrid"></div>
      <div class="deposit-box">
        <p class="instructions" id="payInstructions"></p>
        <div class="copy-row">
          <p class="pay-number" id="payNumber"></p>
          <button class="copy-btn" id="copyBtn" type="button" hidden data-i18n="common.copy">Copier</button>
        </div>
        <form id="depositForm" novalidate>
          <label for="depositName" data-i18n="dep.name">Nom complet de la personne qui a envoyé l'argent</label>
          <input id="depositName" type="text" autocomplete="name" required disabled>

          <label for="depositPhone" data-i18n="dep.phone">Numéro de téléphone utilisé pour l'envoi</label>
          <input id="depositPhone" type="tel" autocomplete="tel" required disabled>

          <label for="depositAmount" data-i18n="dep.amount">Montant envoyé (HTG)</label>
          <input id="depositAmount" type="number" inputmode="numeric" min="1" step="1" required disabled>

          <label for="depositRef" data-i18n="dep.ref">Référence / ID de transaction reçu par SMS</label>
          <input id="depositRef" type="text" autocomplete="off" required disabled>

          <button class="btn" type="submit" id="depositBtn" disabled data-i18n="dep.submit">Confirmer la recharge</button>
        </form>
        <div class="msg" id="depositMsg" role="alert" aria-live="polite"></div>
      </div>
    </div>

    <div class="dash-section">
      <h2 data-i18n="dash.deposits">Mes recharges</h2>
      <div class="list" id="depositList"></div>
      <p class="empty box" id="depositEmpty" data-i18n="dash.noDeposits">Aucune recharge pour le moment.</p>
    </div>
  </main>

  <script type="module" src="recharge.js"></script>
</body>
</html>
