<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1f">
  <title data-i18n="title.checkout">Acheter – Global Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="i18n.js"></script>
</head>
<body>

  <header class="dash-header">
    <div class="wrap">
      <a class="logo" href="dashboard.html">Global Store</a>
      <div class="topbar-extra">
        <select class="currency-select" id="currencySelect" data-i18n-aria="cur.label" aria-label="Devise"></select>
        <select class="lang-select" id="langSelect" data-i18n-aria="lang.label" aria-label="Langue"></select>
        <a class="btn ghost" href="dashboard.html" data-i18n="nav.dashboard">Tableau de bord</a>
      </div>
    </div>
  </header>

  <main class="checkout-wrap">
    <div class="checkout-head">
      <span class="product-icon" id="pIcon"></span>
      <div>
        <h1 id="pName">—</h1>
        <p id="pCat"></p>
      </div>
    </div>

    <form id="checkoutForm" class="checkout-form" novalidate>
      <h2 id="pickTitle" data-i18n="co.pick">Choisir un pack</h2>
      <div class="variant-list" id="variantList"></div>
      <p class="min-note" id="minNote"></p>

      <h2 data-i18n="co.info">Informations nécessaires</h2>
      <div id="fieldsWrap"></div>

      <div class="summary">
        <span>
          <span class="mute" data-i18n="co.total">Total</span>
          <span id="summaryName">—</span>
        </span>
        <span id="summaryPrice">—</span>
      </div>

      <button class="btn" type="submit" id="submitBtn" data-i18n="co.confirm">Confirmer la commande</button>
      <div class="msg" id="msg" role="alert" aria-live="polite"></div>
    </form>
  </main>

  <script type="module" src="checkout.js"></script>
</body>
</html>
