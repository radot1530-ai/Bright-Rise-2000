<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title data-i18n="title.login">Connexion – Global Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="i18n.js"></script>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="index.html">Global Store</a>
      <nav>
        <select class="lang-select" id="langSelect" data-i18n-aria="lang.label" aria-label="Langue"></select>
        <a href="index.html" data-i18n="nav.about">À propos</a>
      </nav>
    </div>
  </header>
  <main class="auth">
    <div class="auth-side">
      <h2 data-i18n="login.side.title">Bon retour.</h2>
      <p data-i18n="login.side.p">Connectez-vous pour acheter vos cartes cadeaux et recharges.</p>
    </div>
    <div class="auth-form">
      <form id="form" data-mode="login" novalidate>
        <h1 data-i18n="login.title">Connexion</h1>
        <p data-i18n="login.sub">Accédez à vos commandes et recharges.</p>
        <label for="email" data-i18n="reg.email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password" data-i18n="reg.password">Mot de passe</label>
        <div class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="toggle" data-i18n="auth.show">Afficher</button></div>
        <a class="forgot" href="reinitialisation.html" data-i18n="auth.forgot">Mot de passe oublié ?</a>
        <button class="btn" type="submit" data-i18n="login.submit">Se connecter</button>
        <div class="msg" id="msg" role="alert" aria-live="polite"></div>
        <p class="alt"><span data-i18n="login.noaccount">Pas encore de compte ?</span> <a href="inscription.html" data-i18n="nav.signup">Créer un compte</a></p>
      </form>
    </div>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
